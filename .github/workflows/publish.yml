name: Publish verified plugin release
on:
  push:
permissions:
  contents: write
jobs:
  publish:
    if: github.actor == 'rookepoole'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize verified release tree
        shell: bash
        run: |
          rm -rf .github
          rm -f .bootstrap
          printf '%s' '' | base64 -d > 'LICENSE'
          printf '%s' '' | base64 -d > 'Overlay.qml'
          printf '%s' '' | base64 -d > 'README.md'
          printf '%s' '' | base64 -d > 'manifest.json'
          printf '%s' '' | base64 -d > 'preview.png'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish verified plugin release'
          git push
